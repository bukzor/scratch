[project]
name = "scratch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.1"
dependencies = []

[tool.uv.workspace]
members = [
    "cached-generator",
]


[tool.black]
line-length = 79
target-version = ['py312']
skip-magic-trailing-comma = true
preview = true
unstable = true
enable-unstable-feature = [
  'hug_parens_with_braces_and_square_brackets'
]

[tool.isort]
profile = "black"
use_parentheses = true
force_single_line = true
multi_line_output = 3
include_trailing_comma = true
sections = ['FUTURE', 'STDLIB', 'THIRDPARTY', 'FIRSTPARTY', 'LOCALFOLDER']
lines_between_sections = 1

[tool.coverage.run]
plugins = ["covdefaults"]

[tool.coverage.report]
show_missing = true
fail_under = 100
skip_covered = false

[tool.pytest.ini_options]
minversion = "6.0"
markers = []
xfail_strict = true
addopts = "-v --durations=20 --durations-min=1 --doctest-modules --last-failed"
testpaths = ["."]
norecursedirs = [
    # don't look at hidden files
    "**/.*",

    # temp files
    "**/Download",

    # runtime files, not version-controlled
    "**/log",
    "**/data",
    "**/libexec",
    "**/__pycache__",
    "**/Library",
    "**/*venv",

    # home for files with separate version control
    "**/repo",
    "**/vendor",

    # dirty hax
    "**/tmp*",
    "**/*tmp",
    "**/*bak",
]
python_files = ["*.py"]
python_classes = ["Test", "Describe"]
python_functions = ["test", "it"]


[tool.pyright]
include = ["."]
exclude = [
    # don't look at hidden files
    "**/.*",

    # temp files
    "**/Download",
    "**/Downloads",

    # runtime files, not version-controlled
    "**/log",
    "**/libexec",
    "**/__pycache__",
    "**/Library",
    "**/*venv/",
    "**/Parallels",
    "**/Library",
    "**/libexec",

    # home for files with separate version control
    "**/repo",
    "**/vendor",

    # dirty hax
    "**/tmp*",
    "**/*tmp",
    "**/*bak",
]
follow_imports_for_stubs = true

pythonPlatform = "Linux"

pythonVersion = "3.12"
extraPaths = [
  "venv/lib/python3.12/site-packages/"
]

typeCheckingMode = "strict"

# don't flag arguments as long as its type is known
reportMissingParameterType = "none"
reportUnknownParameterType = "error"

# turn on all the checks not already enabled by "strict":
reportCallInDefaultInitializer = "error"
reportImplicitStringConcatenation = "error"
reportMissingSuperCall = "error"
reportPropertyTypeMismatch = "error"
reportUninitializedInstanceVariable = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedCallResult = "none"  # too noisy

# maintainer has an strong anti-idomatic stance on what "constant" means
# https://github.com/microsoft/pyright/issues/5265
reportConstantRedefinition = false

### # there's no way to mark simple modules as "py.typed"
### # https://peps.python.org/pep-0561/#packaging-type-information
### reportMissingTypestubs =  false


[tool.mypy]
python_version = "3.12"

files = ["."]
exclude = [
    "(^|/)venv/$",
    "(^|/)bak/$",
]
scripts_are_modules = true

# Strict mode; enables the following flags: (in mypy 1.7.1)
#     --check-untyped-defs
#     --disallow-any-generics
#     --disallow-incomplete-defs
#     --disallow-subclassing-any
#     --disallow-untyped-calls
#     --disallow-untyped-decorators
#     --disallow-untyped-defs
#     --extra-checks
#     --no-implicit-reexport
#     --strict-equality
#     --warn-redundant-casts
#     --warn-return-any
#     --warn-unused-configs
#     --warn-unused-ignores
strict = true

# disallow Any typing:
disallow_any_unimported = true
# better covered by pyright
# currently this flags attributes used in an `assert instance` typeguard..
disallow_any_expr = false
disallow_any_decorated = true
disallow_any_explicit = true

implicit_reexport = false

warn_no_return = true
warn_unreachable = true

# these are better-covered by pyright:
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.pylsp-mypy]
# NOTE: the pylsp server itself cannot be configured via pyproject.toml =.=

enabled = true
live_mode = true
